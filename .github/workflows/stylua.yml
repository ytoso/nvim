# Check Lua Formatting
name: Check Lua Formatting

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  stylua-check:
    name: StyLua Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: StyLua Check
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
